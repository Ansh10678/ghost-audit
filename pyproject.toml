[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-audit"
version = "1.0.0"
description = "Autonomous AI & graph-powered deletion audit agent proving actual enterprise personal data erasure and recreation prevention."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ghost Data Contributors"}
]
keywords = ["data-privacy", "gdpr", "compliance", "ai-agents", "llm", "audit-agent", "data-governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E501",
    "BLE001",
    "S110",
    "S112",
    "SIM102",
]

[tool.black]
line-length = 100
target-version = ['py310']
